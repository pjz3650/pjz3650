<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img"><title>Telemetria do GitHub: commits públicos indexados, contribuições, repositórios, seguidores e sequências.</title><defs><pattern id="screen-grid" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="translate(0 3)"><path d="M32 0H0V32" fill="none" stroke="#8a2229" stroke-opacity=".14"/></pattern></defs><rect x="16" y="0" width="928" height="340" fill="#000000" stroke="none"/><rect x="16" y="0" width="928" height="340" fill="url(#screen-grid)" stroke="none"/><path d="M16 0V340M944 0V340" fill="none" stroke="#e00000" stroke-width="7" opacity=".10"/><path d="M16 0V340M944 0V340" fill="none" stroke="#ef252a" stroke-width="1.4"/><style>
@keyframes ink{from{opacity:0}to{opacity:1}}
@keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
.typed tspan{animation:ink 1ms step-end calc(var(--line) + var(--tick)) both}
.cursor{animation:cursor 1s step-end .85s infinite both}
@media (prefers-reduced-motion:reduce){.typed tspan,.cursor{animation:none}}
