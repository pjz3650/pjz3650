<svg xmlns="http://www.w3.org/2000/svg" width="192" height="74" viewBox="0 0 192 74" role="img"><title>REPOSITÓRIOS</title><defs><pattern id="screen-grid" width="32" height="32" patternUnits="userSpaceOnUse" patternTransform="translate(0 13)"><path d="M32 0H0V32" fill="none" stroke="#8a2229" stroke-opacity=".14"/></pattern></defs><rect x="0" y="0" width="192" height="74" fill="#000000" stroke="none"/><rect x="0" y="0" width="192" height="74" fill="url(#screen-grid)" stroke="none"/><style>
@keyframes ink{from{opacity:0}to{opacity:1}}
@keyframes cursor{0%,49%{opacity:1}50%,100%{opacity:0}}
.typed tspan{animation:ink 1ms step-end calc(var(--line) + var(--tick)) both}
.cursor{animation:cursor 1s step-end .85s infinite both}
@media (prefers-reduced-motion:reduce){.typed tspan,.cursor{animation:none}}
